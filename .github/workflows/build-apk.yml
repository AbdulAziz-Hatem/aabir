name: Build & Sign Karty Hotspot APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/app/release.jks

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karty-Hotspot-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          name: Karty Hotspot ${{ github.ref_name }}
          body: |
            ## كروتي هوت سبوت — Karty Hotspot 📶
            تطبيق أندرويد مفتوح المصدر لقراءة كروت شبكات الواي فاي (ميكروتك) ضوئياً وتسجيل الدخول التلقائي في بوابات الهوت سبوت (Captive Portals)، مصمم خصيصاً لدعم قارئات الشاشة (TalkBack / Jieshuo).
            
            ### الميزات الرئيسية:
            - **تعرف ضوئي محلي بالكامل (Offline OCR):** يعمل بدون إنترنت مع فلترة ذكية لخطوط الخدش وتجاهل أرقام الهواتف والبيانات الجانبية.
            - **تسجيل دخول تلقائي لميكروتك (Captive Portal Auto-Submit):** إرسال طلب الدخول للبوابة فور التقاط الكود دون الحاجة لفتح المتصفح.
            - **إتاحة كاملة للمكفوفين (WCAG 2.1 AA):**
              - نغمات ترددية حية عبر Web Audio API تميز بين النجاح والفشل وصوت تكتكة الرادار أثناء بحث الكاميرا.
              - أنماط اهتزاز متباينة للأحداث المختلفة.
              - إشعارات ناطقة مدمجة عبر محركات تحويل النص إلى كلام (TTS) مع إمكانية اختيار الصوت المفضل من الإعدادات أو إيقاف التنبيه الصوتي.
              - رسائل Toast متوافقة مع قارئات الشاشة.
            - **موقع وموثق رقمياً:** تم التوقيع الرقمي بواسطة مفتاح RSA-4096 المعتمد للمطور عبد العزيز حاتم.
          draft: false
          prerelease: false
