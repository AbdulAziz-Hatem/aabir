name: Build & Sign Aabir APKs (Full & Lite)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Native Full & Lite APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Decode Release Keystore
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/release.jks

      - name: Build Signed Full & Lite APKs via Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleFullRelease assembleLiteRelease --stacktrace

          mkdir -p dist-apks
          cp app/build/outputs/apk/full/release/*-release.apk dist-apks/aabir-full-signed.apk
          cp app/build/outputs/apk/lite/release/*-release.apk dist-apks/aabir-lite-signed.apk
          ls -lh dist-apks/

      - name: Upload Full APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aabir-Full-APK
          path: dist-apks/aabir-full-signed.apk
          retention-days: 30

      - name: Upload Lite APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aabir-Lite-APK
          path: dist-apks/aabir-lite-signed.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apks/*.apk
          name: Aabir ${{ github.ref_name }}
          body: |
            ## تطبيق عَابِر — Aabir 📶 (${{ github.ref_name }})
            تطبيق أندرويد أصيل 100% مبني بلغة **Kotlin** وبإطار **Jetpack Compose الحديث**، مخصص لمسح كروت شبكات الواي فاي (ميكروتك) ضوئياً وتسجيل الدخول التلقائي في بوابات الهوت سبوت (Captive Portals)، مصمم وفق أعلى معايير الإتاحة والوصول الشامل للمكفوفين ومستخدمي قارئات الشاشة (TalkBack / Jieshuo).

            ### 📦 الحزم المتوفرة للتحميل:
            1. **`aabir-full-signed.apk` (النسخة الكاملة - Standalone Offline):**
               - مدمج بها محرك الذكاء الاصطناعي Google ML Kit أوفلاين بالكامل دون إنترنت.
               - تعمل في أي مكان بدون اتصال وبدون الحاجة لخدمات غوغل بلاي.
            2. **`aabir-lite-signed.apk` (النسخة الخفيفة - موفرة البيانات):**
               - حجم ضئيل جداً (~3MB فقط!) لتوفير رصيد البيانات.
               - تعتمد على تنزيل نموذج التعرف الضوئي ديناميكياً عبر خدمات غوغل بلاي.

            ### 🛡️ أبرز ميزات وإصلاحات معمارية Kotlin & Compose:
            - **معمارية أصيلة بالكامل:** تم الاستغناء نهائياً عن الـ WebView وحزم الويب، وتطوير التطبيق بـ Kotlin و CameraX المباشرة.
            - **تحكم عتادي مباشر في الفلاش:** إضاءة فورية للكشاف عند فتح الكاميرا وإطفاؤه آلياً عند انتهاء المسح.
            - **كشف دقيق لبوابة ميكروتك:** سحب عنوان الراوتر النشط من عتاد الواي فاي تلقائياً دون أي تخمين.
            - **فحص محلي فوري لمنع التعليق:** فحص سريع عبر الـ IP الداخلي وصفحة الحالة دون انتظار DNS خارجي.
            - **رادار صوتي هادئ:** تكتكة ترددية ناعمة تنبض كل 2.8 ثانية لطمأنة الكفيف بيقظة الكاميرا دون أي إزعاج.
            - **جاهزية أندرويد 17:** دعم محاذاة 16KB Page Alignment والإيماءات التنبؤية والحواف الآمنة Edge-to-Edge.
            - **توقيع رقمي موثق:** تم التوقيع بمفتاح RSA-4096 المعتمد للمطور عبد العزيز حاتم.
          draft: false
          prerelease: false
