plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseKeystorePath = System.getenv('KEYSTORE_PATH') ?: System.getenv('PINSCAN_KEYSTORE')
def releaseStorePassword = System.getenv('KEYSTORE_PASSWORD') ?: System.getenv('PINSCAN_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('KEYSTORE_KEY_ALIAS') ?: System.getenv('PINSCAN_KEY_ALIAS')
def releaseKeyPassword = System.getenv('KEYSTORE_KEY_PASSWORD') ?: System.getenv('PINSCAN_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace 'com.abdulaziz.aabir'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abdulaziz.aabir'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName "1.0.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // تجريد كافة اللغات غير المطلوبة والإبقاء فقط على العربية والإنجليزية
        resourceConfigurations += ['ar', 'en']

        // حصر المعالجات في معمارية الهواتف الحقيقية (حذف نفايات x86/x86_64 الخاصة بالحواسيب)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    flavorDimensions = ["edition"]

    productFlavors {
        full {
            dimension "edition"
            versionNameSuffix "-full"
        }
        lite {
            dimension "edition"
            versionNameSuffix "-lite"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.10.1'

    // Compose BOM & UI (Material You v3)
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // CameraX
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit Text Recognition (Latin Only)
    fullImplementation 'com.google.mlkit:text-recognition:16.0.1'
    liteImplementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.2'

    // Network (OkHttp)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
